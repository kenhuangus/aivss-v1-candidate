<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560">

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
  .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
  .label { font-size: 26px; font-weight: 600; fill: #1e293b; }
  .small { font-size: 24px; fill: #475569; }
  .mono { font-family: Consolas, 'Courier New', monospace; font-size: 24px; fill: #1d4ed8; }
</style>
<rect width="1300" height="560" fill="#ffffff"/>
<text x="40" y="48" class="title">Exploitation Evidence Ladder</text>
<rect x="40" y="80" width="1220" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="60" y="122" class="label">1. CISA KEV listed</text>
<rect x="40" y="156" width="1220" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="60" y="198" class="label">2. Vulnrichment: active exploitation</text>
<rect x="40" y="232" width="1220" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="60" y="274" class="label">3. Organization observed (unverified)</text>
<rect x="40" y="308" width="1220" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="350" class="label">4. Proof-of-concept exists</text>
<rect x="40" y="384" width="1220" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="426" class="label">5. No evidence</text>
<rect x="40" y="470" width="1220" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 4"/>
<text x="60" y="512" class="small">EPSS — recorded as dated metadata only (not a ladder rung); see Section 12.3.1</text>
</svg>
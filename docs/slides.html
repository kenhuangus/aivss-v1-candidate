<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIVSS 1.0 — Agentic AI Vulnerability Scoring System</title>
  <meta name="description" content="AIVSS 1.0 Masterclass slide deck on technical severity, agentic profiling, and risk-based remediation for autonomous AI systems. Project Lead: Ken Huang, CISSP.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #F0EEE6;
      --surface: #FAF9F5;
      --surface-alt: #F5E6DF;
      --ink: #141413;
      --ink-muted: #6B6B63;
      --rule: #E3E0D6;
      --accent: #D97757;
      --accent-dk: #BD5D3A;
      --accent-sf: #F5E6DF;
      --code-bg: #1A1A18;
      --code-rule: #333330;
      --font-display: ui-serif, Georgia, "Times New Roman", serif;
      --font-body: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
      --font-code: ui-monospace, "JetBrains Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 46px;
      flex: 0 0 46px;
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.0rem;
      z-index: 50;
      gap: 0.75rem;
      overflow-x: auto;
    }
    .header-left { display: flex; align-items: center; gap: 0.7rem; flex: 0 0 auto; }
    .brand-logo {
      width: 30px; height: 30px;
      background: var(--accent-sf); color: var(--accent-dk); border: 1px solid var(--accent);
      border-radius: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-family: var(--font-code);
    }
    .brand-title { font-weight: 700; font-size: 0.90rem; white-space: nowrap; color: var(--ink); }

    .controls { display: flex; align-items: center; gap: 0.40rem; flex: 0 0 auto; }
    .btn {
      background: var(--surface); border: 1px solid var(--rule); color: var(--ink);
      padding: 0.35rem 0.65rem; border-radius: 8px; font-weight: 600; font-size: 0.80rem;
      cursor: pointer; transition: background-color 0.16s, border-color 0.16s; text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-sf); border-color: var(--accent); color: var(--ink); }
    .btn:focus-visible, .slide-select:focus-visible, .goto-input:focus-visible { outline: 2px solid var(--accent-dk); outline-offset: 2px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #FAF9F5; font-weight: 700; }
    .btn-primary:hover { background: var(--accent-dk); border-color: var(--accent-dk); color: #FAF9F5; }
    
    .goto-group {
      display: flex;
      align-items: center;
      gap: 0.22rem;
      background: var(--bg);
      padding: 0.12rem 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--rule);
    }
    .goto-input {
      width: 48px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--rule);
      padding: 0.25rem 0.35rem;
      border-radius: 6px;
      font-family: var(--font-code);
      font-size: 0.80rem;
      font-weight: 750;
      text-align: center;
      -moz-appearance: textfield;
    }
    .goto-input::-webkit-outer-spin-button,
    .goto-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .btn-goto {
      padding: 0.26rem 0.50rem;
      font-weight: 700;
      font-size: 0.78rem;
    }

    select.slide-select {
      background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
      padding: 0.35rem 0.55rem; border-radius: 8px; font-family: var(--font-body);
      font-size: 0.80rem; font-weight: 600;
      max-width: 320px;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide-viewport {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: clamp(0.30rem, 0.8vw, 0.70rem);
    }
    .slide-card {
      width: 100%; max-width: 1540px; height: 100%;
      background: var(--surface); border: 1px solid var(--rule);
      border-radius: 12px; padding: clamp(0.80rem, 1.5vw, 1.40rem); display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .slide-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 0.8rem; margin-bottom: 0.35rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.35rem;
      flex: 0 0 auto;
    }
    .slide-title-wrap { min-width: 0; }
    .slide-title {
      font-family: var(--font-display); font-size: clamp(1.75rem, 2.75vw, 2.45rem);
      font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; color: var(--ink);
    }
    .slide-title.is-long { font-size: clamp(1.45rem, 2.3vw, 1.95rem) !important; letter-spacing: -0.02em; }
    .slide-num-badge {
      background: var(--accent-sf); color: var(--accent-dk); border: 1px solid var(--accent);
      padding: 0.22rem 0.60rem; border-radius: 9999px; font-size: 0.82rem; font-weight: 750; white-space: nowrap;
      flex: 0 0 auto;
    }
    .slide-body {
      --fit-scale: 1;
      --slide-body-base-size: 1.625rem;
      flex: 1; min-height: 0; overflow-y: auto; padding-right: 0.20rem;
      font-size: calc(var(--slide-body-base-size) * var(--fit-scale));
      line-height: 1.50; color: var(--ink);
    }

    code {
      font-family: var(--font-code);
      background: var(--accent-sf);
      color: var(--accent-dk);
      padding: 0.08rem 0.32rem;
      border-radius: 4px;
      font-size: 0.90em;
      white-space: nowrap;
      border: 1px solid var(--rule);
    }
    pre code, .code-editor-body code, .line-code {
      white-space: pre !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      color: inherit !important;
    }
    .slide-content-wrapper {
      width: 100%;
      display: block;
    }
    .slide-svg {
      display: block; width: 100% !important; height: auto; max-width: 100%;
      margin: 0.35rem 0 0.65rem 0;
    }

    /* Comparison Table Styling */
    .slide-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.25rem 0 0.50rem 0;
      font-size: 0.86rem;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .slide-table th {
      background: var(--accent-sf);
      color: var(--ink);
      font-weight: 750;
      text-align: left;
      padding: 0.40rem 0.60rem;
      border-bottom: 1.5px solid var(--rule);
      font-family: var(--font-display);
      font-size: 0.92rem;
    }
    .slide-table td {
      padding: 0.35rem 0.60rem;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      line-height: 1.34;
      vertical-align: middle;
    }
    .slide-table tr:last-child td {
      border-bottom: none;
    }
    .slide-table tr:nth-child(even) td {
      background: rgba(245, 230, 223, 0.25);
    }

    /* Code Slide Layout */
    .code-slide-container {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.15fr);
      gap: 1.05rem;
      height: 100%;
      align-items: start;
    }
    @media (max-width: 1020px) {
      .code-slide-container {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .code-editor-window {
      background: var(--code-bg);
      border: 1px solid var(--code-rule);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
      max-height: calc(100vh - 135px);
    }
    .code-editor-header {
      background: #242320;
      border-bottom: 1px solid var(--code-rule);
      padding: 0.40rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .code-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .code-dot {
      width: 9px; height: 9px; border-radius: 50%;
    }
    .dot-red { background: #E06C75; }
    .dot-yellow { background: #E5C07B; }
    .dot-green { background: #98C379; }
    .code-file-tag {
      font-family: var(--font-code);
      font-size: 0.78rem;
      color: #A0A09A;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .code-lang-tag {
      background: #333330;
      color: #D97757;
      font-family: var(--font-code);
      font-size: 0.70rem;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .code-block {
      background: var(--code-bg);
      color: #FAF9F5;
      font-family: var(--font-code);
      font-size: 0.88rem;
      line-height: 1.44;
      padding: 0.45rem 0;
      margin: 0;
      overflow-x: auto;
      overflow-y: auto;
    }

    .code-line {
      display: flex;
      align-items: baseline;
      padding: 0.06rem 0.55rem;
      transition: background-color 0.15s;
    }
    .code-line:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .code-line-hl {
      background: rgba(217, 119, 87, 0.22);
      border-left: 3.5px solid var(--accent);
      padding-left: calc(0.55rem - 3.5px);
    }
    .line-num {
      color: #5C5C56;
      width: 24px;
      flex: 0 0 24px;
      text-align: right;
      margin-right: 8px;
      font-size: 0.76rem;
      user-select: none;
    }
    .code-line-hl .line-num {
      color: var(--accent);
      font-weight: 700;
    }
    .line-code {
      flex: 1;
      white-space: pre;
    }

    /* Code Concepts Column */
    .code-concepts-column {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      overflow-y: auto;
      max-height: calc(100vh - 135px);
      padding-right: 0.20rem;
    }
    .code-concepts-list {
      display: flex;
      flex-direction: column;
      gap: 0.50rem;
    }
    .code-concept-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent);
      border-radius: 8px;
      padding: 0.60rem 0.85rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .concept-card-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.22rem;
      flex-wrap: wrap;
    }
    .concept-tag {
      background: var(--accent);
      color: #FAF9F5;
      font-size: 0.68rem;
      font-weight: 750;
      padding: 0.10rem 0.40rem;
      border-radius: 4px;
      font-family: var(--font-code);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .concept-name {
      font-family: var(--font-display);
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--ink);
    }
    .concept-card-text {
      font-size: 0.88rem;
      color: var(--ink);
      line-height: 1.40;
    }

    .invariant-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 3.5px solid var(--accent-dk);
      border-radius: 8px;
      padding: 0.60rem 0.85rem;
      font-size: 0.86rem;
      color: var(--ink-muted);
      line-height: 1.38;
    }
    .invariant-title {
      font-family: var(--font-display);
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.20rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Hierarchy Bullets */
    .main-bullets { list-style-type: none; padding-left: 0; margin-top: 0.30rem; }
    .bullet-group { break-inside: avoid; }
    .primary-bullet {
      font-family: var(--font-display); font-size: 1.02em; font-weight: 650; color: var(--ink);
      margin-top: 0.32em; margin-bottom: 0.16em; position: relative; padding-left: 1.25em; line-height: 1.44;
    }
    .primary-bullet::before {
      content: "◆"; color: var(--accent); font-size: 0.72em; line-height: 1; position: absolute; left: 0; top: 0.18em;
    }

    /* Instructor Slide Grid */
    .instructor-slide-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(0, 1.25fr);
      gap: 1.25rem;
      height: 100%;
      align-items: start;
    }
    @media (max-width: 1040px) {
      .instructor-slide-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .instructor-info-col {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 0;
    }
    .author-books-card {
      background: var(--surface);
      border: 1.5px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
    }
    .author-books-header {
      background: var(--accent-sf);
      color: var(--ink);
      font-family: var(--font-display);
      font-weight: 750;
      font-size: 0.88rem;
      padding: 0.45rem 0.80rem;
      border-bottom: 1.5px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.50rem;
      white-space: nowrap;
    }
    .author-books-header a {
      font-family: var(--font-body);
      font-size: 0.76rem;
      font-weight: 750;
      color: var(--accent-dk);
      text-decoration: underline;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .books-gallery-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.40rem;
      padding: 0.50rem;
      background: #FAF8F2;
    }
    .book-item-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.25rem 0.20rem;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: transform 0.16s, border-color 0.16s, box-shadow 0.16s;
    }
    .book-item-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(217, 119, 87, 0.18);
    }
    .book-cover-img {
      width: 100%;
      height: clamp(75px, 11vh, 105px);
      object-fit: contain;
      border-radius: 4px;
      border: 0.5px solid var(--rule);
    }
    .book-item-title {
      font-size: 0.58rem;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      line-height: 1.15;
      margin-top: 0.20rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      display: block;
    }
    .book-publisher-tag {
      font-size: 0.48rem;
      font-weight: 800;
      color: var(--accent-dk);
      background: var(--accent-sf);
      padding: 0.05rem 0.20rem;
      border-radius: 3px;
      margin-top: 0.12rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
      line-height: 1.1;
    }

    /* Slide 1 Cover Layout */
    .slide-1-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .slide-1-instructor-card {
      background: var(--surface);
      border: 1.5px solid var(--rule);
      border-radius: 12px;
      padding: 0.95rem 1.40rem;
      display: flex;
      align-items: center;
      gap: 1.40rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .slide-1-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .slide-1-avatar-img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 4px 12px rgba(217, 119, 87, 0.25);
      background: var(--surface-alt);
    }
    .slide-1-instructor-info {
      display: flex;
      flex-direction: column;
      gap: 0.30rem;
      flex: 1;
    }
    .slide-1-instructor-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--accent-sf);
      color: var(--accent-dk);
      border: 1px solid var(--accent);
      font-family: var(--font-code);
      font-size: 0.75rem;
      font-weight: 750;
      padding: 0.16rem 0.50rem;
      border-radius: 6px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .slide-1-instructor-name {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.15;
    }
    .slide-1-instructor-titles {
      display: flex;
      flex-direction: column;
      gap: 0.20rem;
      margin-top: 0.10rem;
    }
    .slide-1-title-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.98rem;
      font-weight: 650;
      color: var(--ink);
    }
    .slide-1-title-item .title-icon {
      font-size: 1.10rem;
      flex-shrink: 0;
    }
    .slide-1-title-highlight {
      color: var(--accent-dk);
      font-weight: 750;
    }
    .slide-1-pillars-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.65rem;
    }
    @media (max-width: 900px) {
      .slide-1-pillars-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .slide-1-instructor-card {
        flex-direction: column;
        text-align: center;
        align-items: center;
      }
      .slide-1-instructor-badge {
        margin: 0 auto;
      }
      .slide-1-title-item {
        justify-content: center;
      }
    }
    .slide-1-pillar-pill {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 0.50rem 0.70rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .slide-1-pillar-title {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 750;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .slide-1-pillar-desc {
      font-size: 0.74rem;
      color: var(--ink-muted);
      line-height: 1.28;
    }

    /* Comparison Thesis Layout */
    .thesis-slide-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .thesis-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      flex: 1;
      align-items: stretch;
    }
    @media (max-width: 1040px) {
      .thesis-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .thesis-card {
      background: var(--surface);
      border: 1.5px solid var(--rule);
      border-radius: 9px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .thesis-card.trad-card {
      border-top: 3.5px solid #2563eb;
    }
    .thesis-card.harn-card {
      border-top: 3.5px solid #059669;
    }
    .thesis-card-header {
      padding: 0.40rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      border-bottom: 1.5px solid var(--rule);
    }
    .thesis-card-header.trad-header {
      background: #F0F5FE;
    }
    .thesis-card-header.harn-header {
      background: #E8F8F2;
    }
    .thesis-icon {
      font-size: 1.15rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .thesis-title {
      font-family: var(--font-display);
      font-size: 0.94rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.20;
    }
    .thesis-subtitle {
      font-size: 0.72rem;
      color: var(--ink-muted);
      font-weight: 500;
      margin-top: 0.05rem;
    }
    .thesis-badge {
      margin-left: auto;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 0.10rem 0.38rem;
      border-radius: 4px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .thesis-badge.trad-badge {

    const slidesData = [{"number": 1, "slide_type": "title", "raw_lines": ["AIVSS 1.0 — Agentic AI Vulnerability Scoring System", "Technical Severity, Agentic AI Profile, and Risk-Based Remediation for Autonomous Systems", "OWASP AIVSS Working Group"]}, {"number": 2, "slide_type": "speaker", "raw_lines": ["About the Author & Project Lead: Ken Huang, CISSP", "• OWASP AIVSS Project Lead and primary author of the AIVSS 1.0 specification", "• Adjunct Professor, University of San Francisco (Cybersecurity & Agentic AI)", "• Fellow & Co-Chair of two Cloud Security Alliance (CSA) AI Safety working groups", "• Core member of the OWASP Top 10 for Large Language Model Applications and Agentic AI", "• Member, AIUC-1 Consortium & Grant Reviewer for Schmidt Sciences", "• Author of 12 published AI & cybersecurity books (Springer, Cambridge, Wiley, Packt)", "• CEO of DistributedApps.ai  ·  Substack: kenhuangus.substack.com  ·  LinkedIn: linkedin.com/in/kenhuang8"]}, {"number": 3, "slide_type": "comparison", "raw_lines": ["The Vulnerability Management Thesis: Conflated Severity vs. Decoupled Control", "Deterministic IT Engineering → Decoupled Non-Deterministic Agentic Control Systems"]}, {"number": 4, "slide_type": "agenda", "raw_lines": ["Master Architecture Roadmap & Course Agenda", "Six core modules spanning technical severity, agentic profiling, and federal remediation"], "agenda": [{"num": "01", "title": "The Three-Layer Architecture & Conformance", "body": "Strict decoupling of technical severity, agentic profile metadata, and remediation timelines across Conformance Levels 1, 2, and 3."}, {"num": "02", "title": "CVSS v4.0 Interpretation for Autonomous Agents", "body": "Normative scoring rules for Subsequent Systems (`SC/SI/SA`), Privileges Required (`PR`), and User Interaction (`UI:N`)."}, {"num": "03", "title": "The Eight-Metric Agentic AI Profile & Effect Class", "body": "Formal definitions of `LC`, `CP`, `AP`, `SR`, `EX`, `PT`, `CA`, `TD` and the deterministic `A0` / `A1` r, persistence, and governance assurance"], "points": [{"num": "01", "title": "Dual Metric Group Division", "body": "Four Classifying Metrics (`LC`, `CP`, `AP`, `SR`) evaluate intrinsic execution mechanics and derive the Agentic AI Effect Class. Four Assurance Metrics (`EX`, `PT`, `CA`, `TD`) record architectural boundaries, provider dependencies, financial limits, and auditability."}, {"num": "02", "title": "Canonical Vector Syntax", "body": "Transmitted as a standardized companion string: `AIVSS:1.0/LC:D/CP:C/AP:L/SR:R/EX:W/PT:H/CA:W/TD:H`. All eight keys are mandatory; unknown values are recorded as `X` (insufficient evidence) to preserve forensic completeness."}, {"num": "03", "title": "Parallel Metadata Invariant", "body": "Reported as the `agentic_ai_profile` JSON object alongside the CVSS vector. It informs operational remediation escalation and release gates, but strictly never enters the arithmetic severity computation."}]}, {"number": 7, "slide_type": "triple", "raw_lines": ["Architecture Layer 3: Risk-Based Remediation Urgency", "Decoupling remediation urgency from severity numbers via CISA BOD 26-04 and SSVC"], "points": [{"num": "01", "title": "Revocation of Severity-Driven Deadlines", "body": "CISA BOD 26-04 revoked legacy CVSS-severity-driven federal deadlines (BOD 19-02/22-01), replacing them with Stakeholder-Specific Vulnerability Categorization (SSVC). AIVSS adopts the published deployer table (`cisa:DT_BOD2604:1.0.0`)."}, {"num": "02", "title": "Four Factual Decision Inputs", "body": "Remediation urgency keys mechanically on four operational facts: `in_kev` (active exploitation), `publicly_exposed` (network reach), `automatable` (exploit execution path), and `technical_impact` (partial vs. total system compromise)."}, {"num": "03", "title": "Transparent Agentic AI Overlay", "body": "A substantial agentic effect (`A2`) advances the baseline remediation timeline by exactly one tier (FSU ➔ 60D, 60D ➔ 14D, 14D ➔ 3D). It stops at the 3-day ceiling and never introduces the forensic triage requirement (3DF)."}]}, {"number": 8, "slide_type": "triple", "raw_lines": ["Conformance Levels & Architectural Boundaries", "Three standardized implementation tiers satisfying diverse enterprise governance requirements"], "points": [{"num": "01", "title": "Level 1 — Core Technical Conformance", "body": "Requires a valid CVSS v4.0 Base vector, complete 8-metric `aivss_vector`, and derived Effect Class (`A0`, `A1`, `A2`, or `AX`). Minimum level required to claim 'AIVSS 1.0 conformant' in advisories and vulnerability databases."}, {"num": "02", "title": "Level 2 — Deployer Operational Conformance", "body": "Satisfies Level 1 plus execution of the Layer 3 SSVC / BOD 26-04 deployer decision table (`cisa:DT_BOD2604:1.0.0`). Mandatory for organizations managing operational patch cadences, incident response SLAs, and federal compliance obligations."}, {"num": "03", "title": "Level 3 — Enterprise Priority Index (AIVSS-P)", "body": "Satisfies Level 2 plus computation of the internal `AIVSS-P` priority index incorporating business impact, reach, and residual likelihood. Strictly internal to assessing organizations; prohibited from external publication."}]}, {"number": 9, "slide_type": "triple", "raw_lines": ["CVSS v4.0 Interpretation for Autonomous Agents", "Normative interpretation rules mapping autonomous agent architecture into CVSS Base metrics"], "points": [{"num": "01", "title": "Subsequent Systems Across Tool Boundaries", "body": "The agent reasoning runtime is the Vulnerable System. Downstream APIs, databases, CRM systems, and code execution environments reachable via tools are Subsequent Systems (`SC/SI/SA`). Exfiltration to an attacker's C2 server is `VC`, not `SC`."}, {"num": "02", "title": "Privileges Required (PR) Measures Attacker", "body": "`PR` reflects credentials the *attacker* must possess to execute the exploit. If an unauthenticated user submits text that exploits a privileged admin agent, `PR` is strictly `None` (`PR:  language execution reach and cross-session memory poisoning"], "points": [{"num": "01", "title": "Language-Mediated Control (LC)", "body": "`Direct (D)`: Attacker natural language reaches privileged reasoning or tool paths without mediation. `Indirect (I)`: Ingested via RAG, search, or tool output. `Mediated (M)`: Constrained by strict parsers or fixed schemas. `None (N)`: No language influence."}, {"num": "02", "title": "Context Persistence (CP)", "body": "`Cross-session (C)`: Attacker context persists in durable vector stores, databases, or user profiles across sessions. `Session (S)`: Persists across multi-turn context windows, cleared on reset. `None (N)`: Ephemeral execution confined to a single turn."}, {"num": "03", "title": "Canonical Poisoning Interaction", "body": "The combination of `LC:I` and `CP:C` represents the canonical indirect memory poisoning flaw (OWASP ASI06), converting passive knowledge stores into permanent dormant attack vectors that hijack future agent sessions."}]}, {"number": 12, "slide_type": "triple", "raw_lines": ["Classifying Metrics: Propagation & Exploit Reliability", "Measuring lateral compromise across trust boundaries and empirical reproducibility"], "points": [{"num": "01", "title": "Agentic Propagation (AP)", "body": "`Lateral (L)`: Compromised instructions, memory, or authority cross trust boundaries to sibling agents, tenants, or downstream services. `Contained (C)`: Spreads within the agent's own tool scope. `None (N)`: Exploitation is strictly isolated."}, {"num": "02", "title": "Stochastic Exploit Reliability (SR)", "body": "`Reliable (R)`: Deterministic exploit reproduction (≥80% success or free retries). `Probabilistic (P)`: Variable reproduction (20%–80%) sensitive to model sampling. `Unreliable (U)`: Low reproducibility (<20%) or execution paths penalizing retries."}, {"num": "03", "title": "Empirical Statistical Grounding", "body": "In production benchmarks, `SR:R` requires rigorous empirical verification (e.g. 30/30 n (C)\"", "  },", "  \"decision\": {", "    \"in_kev\": false, \"publicly_exposed\": true,", "    \"automatable\": true, \"technical_impact\": \"total\",", "    \"bod_2604_timeline\": \"3D\",", "    \"aivss_recommended_timeline\": \"3D\"", "  }", "}"], "concepts": [{"tag": "CVSS 3.1 CONFLICT RESOLVED", "title": "Subsequent System Integrity", "desc": "Microsoft published CVSS v3.1 9.3 (Critical, Scope Changed) while NVD published 7.5 (High, Scope Unchanged). AIVSS v4.0 resolves this: SharePoint/Teams stores are scored as Subsequent Systems (`SC:H`), producing an objective 7.8."}, {"tag": "AUTONOMOUS RAG", "title": "Zero-Click Ingestion (UI:N)", "desc": "Autonomous document and email ingestion via background RAG indexing requires zero human interaction. AIVSS strictly enforces `UI:N`, eliminating improper reliance on human interaction credits."}, {"tag": "PERSISTENT POISON", "title": "A2 Effect Class Derivation", "desc": "Indirect language control (`LC:I`) combined with cross-session email persistence (`CP:C`) triggers the `A2` rule. While A2 advocates rapid patching, the BOD 26-04 baseline is already at the 3-day ceiling (3D)."}], "invariant": "AIVSS equals CVSS-BTE (7.8). Microsoft's 9.3 and NVD's 7.5 are superseded by CVSS v4.0 multi-system modeling. Remediation stops at the CISA 3-day ceiling without inventing unverified deadlines."}, {"number": 19, "slide_type": "code", "raw_lines": ["Synthetic Deep Dive: ASI06 Memory & Context Poisoning", "Walkthrough of cross-session context corruption and Wilson lower-bound empirical reliability"], "file_tag": "examples/asi06-example.json", "lang_tag": "JSON", "highlight_lines": [6, 12, 16], "code_lines": ["{", "  \"finding_id\": \"AIVSS-ASI06-001\",", "  \"risk_category\": \"ASI06\",", "  \"title\": \"Adversarial content in agent memory biases later sessions\",", "  \"cvss_vector\": \"CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:L/VA:L/SC:H/SI:N/SA:N/E:P\",", "  \"aivss_vector\": \"AIVSS:1.0/LC:D/CP:C/AP:L/SR:R/EX:W/PT:H/CA:M/TD       }
      document.getElementById('btn-prev').disabled = (idx === 0);
      document.getElementById('btn-next').disabled = (idx === slidesData.length - 1);

      let html = '';
      if (t === 'title') html = renderTitle();
      else if (t === 'speaker') html = renderSpeaker(slide);
      else if (t === 'agenda') html = renderAgenda(slide);
      else if (t === 'section') html = renderSection(slide);
      else if (t === 'triple') html = renderTriple(slide);
      else if (t === 'comparison') html = renderComparison(slide);
      else if (t === 'table') html = renderTable(slide);
      else if (t === 'code') html = renderCode(slide);
      else if (t === 'thanks') html = renderThanks(slide);
      else {
        html = '<div id="slide-content-wrap" class="slide-content-wrapper">' + formatBullets((slide.raw_lines || []).slice(1)) + '</div>';
      }
      bodyEl.innerHTML = html;

      bodyEl.style.setProperty('--fit-scale', '1.0');
      const wrapper = document.getElementById('slide-content-wrap') || bodyEl;
      const clientH = bodyEl.clientHeight;
      let scale = 1.0;
      let shrink = 0;
      while ((bodyEl.scrollHeight > clientH || wrapper.offsetHeight > (clientH - 6)) && scale > 0.55 && shrink < 70) {
        scale -= 0.02;
        bodyEl.style.setProperty('--fit-scale', scale.toFixed(2));
        shrink++;
      }
      document.getElementById('progress-fill').style.width = (((idx + 1) / slidesData.length) * 100) + '%';
    }

    function renderGrid() {
      const grid = document.getElementById('grid-mode');
      grid.innerHTML = '';
      slidesData.forEach((slide, idx) => {
        const card = document.createElement('div');
        card.className = 'grid-slide-card';
        card.onclick = () => { isGridMode = true; toggleMode(); renderSlide(idx); };
        const title = slide.raw_lines[0] || ('Slide ' + slide.number);
        const body = (slide.raw_lines.slice(1, 3).join(' ') || '');
        card.innerHTML = '<div style="font-size:0.75rem;font-weight:800;margin-bottom:0.35rem;color:var(--accent-dk);">SLIDE ' + slide.number + '</div>'
          + '<div class="grid-slide-title">' + esc(title) + '</div>'
          + '<div class="grid-slide-body">' + esc(body) + '</div>';
        grid.appendChild(card);
      });
    }
    function prevSlide() { renderSlide(currentIdx - 1); }
    function nextSlide() { renderSlide(currentIdx + 1); }
    function goToSlide(val) { renderSlide(parseInt(val, 10)); }
    function jumpToEnteredSlide() {
      const input = document.getElementById('goto-input');
      const val = parseInt(input.value, 10);
      if (!isNaN(val) && val >= 1 && val <= slidesData.length) {
        renderSlide(val - 1);
        input.value = '';
      } else {
        alert('Please enter a slide number between 1 and ' + slidesData.length + '.');
      }
    }
    function toggleMode() {
      isGridMode = !isGridMode;
      document.getElementById('presentation-mode').style.display = isGridMode ? 'none' : 'flex';
      document.getElementById('grid-mode').style.display = isGridMode ? 'grid' : 'none';
      document.getElementById('mode-text').innerText = isGridMode ? 'Presentation Mode' : 'Grid View';
      document.getElementById('mode-icon').innerText = isGridMode ? '📺' : '📜';
      if (isGridMode) renderGrid();
    }
    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else if (document.exitFullscreen) document.exitFullscreen();
    }
    document.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      if (e.key === 'm' || e.key === 'M') toggleMode();
      if (e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        const el = document.getElementById('goto-input');
        if (el) { el.focus(); el.select(); }
      }
    });
    window.addEventListener('resize', () => { if (!isGridMode) renderSlide(currentIdx); });
    function getInitialSlideIndex() {
      const hash = window.location.hash.replace('#', '');
      if (hash) {
        const num = parseInt(hash, 10);
        if (!isNaN(num)) {
          const found = slidesData.findIndex(s => s.number === num);
          if (found !== -1) return found;
        }
      }
      return 0;
    }
    window.addEventListener('hashchange', () => {
      const idx = getInitialSlideIndex();
      if (idx !== currentIdx) renderSlide(idx);
    });
    renderSlide(getInitialSlideIndex());

  </script>
</body>
</html>
